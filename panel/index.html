<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot Office</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #090d16;
      --surface: #111827;
      --card: #151d2e;
      --border: rgba(148, 163, 184, 0.16);
      --fg: #eef2f8;
      --muted: #8e9db5;
      --cyan: #38bdf8;
      --green: #4ade80;
      --amber: #fbbf24;
      --red: #ef4444;
    }
    html.light {
      --bg: #e5ebf3;
      --surface: #f8fafc;
      --card: #ffffff;
      --border: rgba(15, 23, 42, 0.12);
      --fg: #0f172a;
      --muted: #64748b;
    }
    body {
      margin: 0;
      padding: 6px 8px 14px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--orca-font-sans, -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif);
      font-size: 12px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Ultra-lightweight header: ZERO backdrop-filter, ZERO infinite CSS animations */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      margin-bottom: 6px;
      padding: 7px 10px;
      background: #131a29;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .brand-icon {
      width: 20px; height: 20px; border-radius: 6px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; flex-shrink: 0;
    }
    .brand-title { font-weight: 800; font-size: 13px; color: #f8fafc; white-space: nowrap; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 1px 7px; border-radius: 999px; font-size: 9.5px; font-weight: 700;
      background: rgba(74, 222, 128, 0.12); border: 1px solid rgba(74, 222, 128, 0.32); color: #86efac;
    }
    .live-dot { width: 5.5px; height: 5.5px; border-radius: 50%; background: #4ade80; }

    .counters { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .cnt {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; color: #94a3b8; padding: 2px 7px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .cnt b { color: #f1f5f9; font-weight: 800; font-variant-numeric: tabular-nums; }
    .cnt-dot { width: 6.5px; height: 6.5px; border-radius: 50%; flex-shrink: 0; }
    .cnt-dot.red { background: #ef4444; }
    .cnt-dot.blue { background: #38bdf8; }
    .cnt-dot.gray { background: #64748b; }
    .cnt.clickable { cursor: pointer; }
    .cnt.has-need {
      background: rgba(220, 38, 38, 0.24); border-color: rgba(248, 113, 113, 0.72); color: #fecaca;
    }
    .cnt.has-need:hover { background: rgba(220, 38, 38, 0.36); color: #fff; }

    .ctrl-left, .ctrl-right { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .seg {
      display: inline-flex; padding: 2px; border-radius: 7px;
      background: #0a0f1a; border: 1px solid var(--border);
    }
    .seg-btn {
      border: none; background: transparent; color: #8e9db5;
      font-size: 11px; font-weight: 700; padding: 2.5px 9px; border-radius: 5px; cursor: pointer;
    }
    .seg-btn.active { background: #f1f5f9; color: #0f172a; }
    .seg-btn:not(.active):hover { color: #e2e8f0; }

    .search-box {
      width: 118px;
      padding: 3px 7px; border-radius: 6px;
      border: 1px solid var(--border); background: #0b101c; color: #e2e8f0;
      font-size: 11px; outline: none;
    }
    .search-box:focus { border-color: var(--cyan); width: 146px; }
    .eng-select {
      padding: 2.5px 5px; border-radius: 6px;
      border: 1px solid var(--border); background: #0b101c; color: #cbd5e1;
      font-size: 11px; outline: none; cursor: pointer;
    }
    .btn {
      border: 1px solid var(--border); background: #1a2336; color: #cbd5e1;
      border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .btn:hover, .btn.active { border-color: var(--cyan); color: #7dd3fc; background: rgba(56, 189, 248, 0.14); }

    /* 2.5D Isometric Stage */
    .stage-wrap {
      position: relative;
      width: 100%;
      height: calc(100vh - 156px);
      min-height: 460px;
      max-height: 700px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: #0c1220;
    }
    #officeCanvas { display: block; width: 100%; height: 100%; }
    .stage-hud {
      position: absolute; right: 9px; bottom: 9px; z-index: 15;
      display: flex; align-items: center; gap: 4px;
    }
    .hud-btn {
      border: 1px solid rgba(148, 163, 184, 0.26);
      background: rgba(15, 23, 42, 0.88); color: #e2e8f0;
      border-radius: 6px; padding: 3px 7px; font-size: 10.5px; font-weight: 700;
      cursor: pointer;
    }
    .hud-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .stage-hint {
      position: absolute; left: 9px; bottom: 9px; z-index: 15;
      font-size: 10px; color: rgba(148, 163, 184, 0.78);
      background: rgba(11, 16, 28, 0.78); padding: 2px 7px; border-radius: 5px;
      pointer-events: none;
    }
    .empty-overlay {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 18;
      background: rgba(15, 23, 42, 0.94); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 18px; text-align: center; max-width: 80%;
    }
    .empty-overlay-title { font-size: 13px; font-weight: 800; color: #f8fafc; margin-bottom: 4px; }
    .empty-overlay-sub { font-size: 11px; color: var(--muted); }

    /* Grouped Workbench List View */
    .workbench { display: flex; flex-direction: column; gap: 8px; }
    .wb-group { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .wb-group.attn { border-color: rgba(248, 113, 113, 0.52); }
    .wb-g-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 11px; background: rgba(255, 255, 255, 0.025);
      border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 800; color: var(--fg);
    }
    .wb-g-head .left { display: flex; align-items: center; gap: 6px; }
    .wb-row {
      display: flex; align-items: center; gap: 9px; padding: 8px 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.045); cursor: pointer;
    }
    .wb-row:last-child { border-bottom: none; }
    .wb-row:hover { background: rgba(56, 189, 248, 0.08); }
    .wb-row.attn { background: rgba(239, 68, 68, 0.08); }
    .wb-row.attn:hover { background: rgba(239, 68, 68, 0.14); }
    .wb-av {
      position: relative; width: 32px; height: 32px; border-radius: 9px;
      background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .wb-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .wb-av-dot {
      position: absolute; top: -4px; right: -4px; min-width: 14px; height: 14px;
      border-radius: 999px; background: #ef4444; border: 1.5px solid #151d2e;
      color: #fff; font-size: 8.5px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }
    .wb-body { min-width: 0; flex: 1; }
    .wb-top { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .wb-name { font-weight: 700; font-size: 12px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wb-tag { font-size: 9.5px; font-weight: 700; padding: 1px 5.5px; border-radius: 4px; background: rgba(148, 163, 184, 0.12); color: var(--muted); }
    .wb-tag.eng { background: rgba(56, 189, 248, 0.14); color: #7dd3fc; }
    .wb-tag.stall { background: rgba(245, 158, 11, 0.2); color: #fde68a; }
    .wb-sub { margin-top: 2px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wb-go-btn {
      padding: 4px 9px; border-radius: 6px; font-size: 10.5px; font-weight: 700;
      border: 1px solid rgba(248, 113, 113, 0.65); background: rgba(220, 38, 38, 0.22);
      color: #fecaca; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .wb-go-btn:hover { background: rgba(220, 38, 38, 0.4); color: #fff; }
    .wb-time { font-size: 10.5px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }

    /* Bottom Legend & B1 Standalone Bar */
    .legend {
      margin-top: 6px; padding: 5px 9px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;
      font-size: 10px; color: var(--muted);
    }
    .legend-grp { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .lg-item { display: inline-flex; align-items: center; gap: 4px; }
    .lg-dot { width: 6px; height: 6px; border-radius: 50%; }

    .guest-bar {
      margin-top: 6px; background: var(--card); border: 1px solid var(--border);
      border-radius: 9px; padding: 6px 10px;
    }
    .guest-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer;
    }
    .guest-list { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
    .guest-chip {
      padding: 3px 8px; border-radius: 6px; font-size: 10.5px;
      background: rgba(148, 163, 184, 0.1); border: 1px solid var(--border);
      color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .guest-chip:hover { border-color: var(--cyan); color: var(--cyan); }
    .guest-chip.attn { border-color: rgba(239, 68, 68, 0.65); color: #fecaca; background: rgba(239, 68, 68, 0.14); }

    /* Sleek Preview & Jump Modal (ZERO backdrop-filter for ultra-low GPU!) */
    .card-backdrop {
      position: fixed; inset: 0; z-index: 120;
      background: rgba(4, 7, 14, 0.74);
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
    }
    .inspector-card {
      width: 100%; max-width: 416px; max-height: calc(100vh - 28px);
      overflow-y: auto;
      background: #151e30; color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 13px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.68);
      padding: 14px;
    }
    .inspector-card.is-attn { border-color: rgba(248, 113, 113, 0.72); }
    .ic-head { display: flex; align-items: center; gap: 10px; }
    .ic-av {
      position: relative; width: 42px; height: 42px; border-radius: 12px;
      background: #1e293b; border: 1.5px solid rgba(255, 255, 255, 0.18);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ic-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
    .ic-av-dot {
      position: absolute; top: -5px; right: -5px; width: 13px; height: 13px; border-radius: 50%;
      background: #ef4444; border: 2px solid #151e30;
    }
    .ic-title-wrap { min-width: 0; flex: 1; }
    .ic-name { font-size: 14px; font-weight: 800; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ic-meta { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .ic-pill { padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 700; background: rgba(148, 163, 184, 0.14); color: #cbd5e1; }
    .ic-pill.eng { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; }
    .ic-pill.branch { cursor: pointer; background: rgba(167, 139, 250, 0.16); color: #ddd6fe; }
    .ic-pill.branch:hover { background: rgba(167, 139, 250, 0.28); }
    .ic-close {
      width: 26px; height: 26px; border-radius: 7px;
      border: 1px solid var(--border); background: #1e293b; color: #cbd5e1;
      font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ic-close:hover { background: #334155; color: #fff; }

    .ic-status-bar {
      margin-top: 10px; padding: 7px 10px; border-radius: 9px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 11.5px; font-weight: 700;
      background: #1d273b; border: 1px solid var(--border);
    }
    .ic-status-bar.attn { background: rgba(127, 29, 29, 0.55); border-color: rgba(248, 113, 113, 0.55); color: #fecaca; }
    .ic-status-bar.stall { background: rgba(120, 53, 15, 0.55); border-color: rgba(251, 191, 36, 0.55); color: #fef3c7; }
    .ic-status-bar.working { background: rgba(6, 78, 59, 0.48); border-color: rgba(74, 222, 128, 0.42); color: #bbf7d0; }
    .ic-time { font-size: 10.5px; font-weight: 500; opacity: 0.9; white-space: nowrap; }

    .ic-links { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
    .ic-link-chip {
      font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 7px;
      background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.38);
      color: #7dd3fc; cursor: pointer;
    }
    .ic-link-chip:hover { background: rgba(56, 189, 248, 0.26); color: #fff; }

    .ic-decision-box {
      margin-top: 9px; background: rgba(127, 29, 29, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.45); border-radius: 10px; padding: 10px;
    }
    .ic-dec-title { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; font-weight: 800; color: #fee2e2; line-height: 1.4; }
    .ic-dec-num { font-family: ui-monospace, monospace; font-size: 10px; padding: 1px 5px; border-radius: 4px; background: rgba(239, 68, 68, 0.32); color: #fecaca; flex-shrink: 0; }
    .ic-dec-ctx {
      margin-top: 6px; padding: 7px 8px; border-radius: 7px; background: rgba(9, 13, 23, 0.7);
      font-size: 11px; line-height: 1.5; color: #dbe5f3; white-space: pre-wrap; max-height: 100px; overflow-y: auto; user-select: text;
    }
    .ic-q-list { margin-top: 7px; display: flex; flex-direction: column; gap: 6px; }
    .ic-q-item { padding: 6px 8px; border-radius: 7px; background: rgba(15, 23, 42, 0.72); border: 1px solid var(--border); }
    .ic-q-prompt { font-size: 11px; font-weight: 700; color: #f8fafc; line-height: 1.4; }
    .ic-q-opts { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
    .ic-q-chip { font-size: 10px; padding: 2px 6px; border-radius: 999px; background: rgba(148, 163, 184, 0.12); color: #cbd5e1; border: 1px solid var(--border); }
    .ic-q-chip.rec { background: rgba(251, 191, 36, 0.16); color: #fde68a; border-color: rgba(251, 191, 36, 0.45); font-weight: 700; }

    .ic-section-title { margin: 11px 0 5px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #8e9db5; }
    .ic-timeline {
      background: #0d1320; border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 7px; user-select: text;
    }
    .ic-tl-row { font-size: 11px; line-height: 1.48; color: #e2e8f0; word-break: break-word; }
    .ic-tl-row + .ic-tl-row { padding-top: 6px; border-top: 1px dashed rgba(148, 163, 184, 0.16); color: #94a3b8; }
    .ic-tl-lbl {
      display: inline-block; font-size: 9.5px; font-weight: 700; padding: 0 5px; margin-right: 5px;
      border-radius: 4px; background: rgba(56, 189, 248, 0.15); color: #7dd3fc; text-transform: uppercase;
    }

    .ic-workers { display: flex; flex-direction: column; gap: 5px; max-height: 145px; overflow-y: auto; }
    .ic-worker-row {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px;
      background: #0f172a; border: 1px solid var(--border); cursor: pointer;
    }
    .ic-worker-row:hover { border-color: var(--cyan); }
    .ic-worker-row.attn { border-color: rgba(248, 113, 113, 0.55); background: rgba(127, 29, 29, 0.25); }
    .ic-w-dot { width: 7.5px; height: 7.5px; border-radius: 50%; flex-shrink: 0; background: #64748b; }
    .ic-w-dot.working { background: #4ade80; }
    .ic-w-dot.attn { background: #ef4444; }
    .ic-w-main { min-width: 0; flex: 1; }
    .ic-w-name { font-size: 11px; font-weight: 700; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ic-w-act { font-size: 10px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ic-w-go { font-size: 10.5px; color: #7dd3fc; font-weight: 700; flex-shrink: 0; }

    .ic-actions { margin-top: 12px; display: flex; gap: 7px; justify-content: flex-end; flex-wrap: wrap; }
    .ic-btn {
      border-radius: 8px; padding: 6.5px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer;
      border: 1px solid rgba(56, 189, 248, 0.55); background: rgba(56, 189, 248, 0.2); color: #e0f2fe;
    }
    .ic-btn:hover { background: rgba(56, 189, 248, 0.34); }
    .ic-btn.primary-attn { border-color: #f87171; background: #dc2626; color: #ffffff; }
    .ic-btn.primary-attn:hover { background: #ef4444; }
    .ic-btn.secondary { border-color: var(--border); background: #1e293b; color: #cbd5e1; }
    .ic-btn.secondary:hover { border-color: rgba(148, 163, 184, 0.5); color: #fff; }

    .toast-wrap { position: fixed; right: 12px; bottom: 12px; z-index: 150; display: flex; flex-direction: column; gap: 6px; max-width: 300px; }
    .toast {
      background: #131c2e; border: 1px solid rgba(56, 189, 248, 0.55);
      border-radius: 9px; padding: 8px 11px; color: #f8fafc; font-size: 11px; line-height: 1.4;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55); cursor: pointer;
    }
    .toast.attn { border-color: rgba(248, 113, 113, 0.78); background: #450a0a; color: #fee2e2; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="brand-icon">🏢</span>
        <span class="brand-title" id="brandTitle">AI 总部大楼</span>
        <span class="live-pill"><span class="live-dot"></span><span id="liveLabel">Live</span></span>
      </div>
      <div class="counters">
        <span class="cnt clickable" id="cntNeed"><span class="cnt-dot red"></span><span id="cntNeedLbl"></span> <b id="cntNeedVal">0</b></span>
        <span class="cnt"><span class="cnt-dot blue"></span><span id="cntWorkLbl"></span> <b id="cntWorkVal">0</b></span>
        <span class="cnt"><span class="cnt-dot gray"></span><span id="cntIdleLbl"></span> <b id="cntIdleVal">0</b></span>
      </div>
    </div>
    <div class="topbar-row">
      <div class="ctrl-left">
        <div class="seg">
          <button class="seg-btn active" id="viewOfficeBtn"></button>
          <button class="seg-btn" id="viewListBtn"></button>
        </div>
        <input class="search-box" id="searchInput" type="search" />
        <select class="eng-select" id="engFilter">
          <option value="all">All</option>
          <option value="claude">Claude</option>
          <option value="antigravity">Antigravity</option>
          <option value="codex">Codex</option>
          <option value="pi">Pi</option>
        </select>
      </div>
      <div class="ctrl-right">
        <button class="btn" id="activeOnlyBtn"></button>
        <button class="btn" id="refreshBtn"></button>
      </div>
    </div>
  </div>

  <div id="officeView">
    <div class="stage-wrap" id="stageWrap">
      <canvas id="officeCanvas"></canvas>
      <div class="stage-hint" id="stageHint"></div>
      <div class="stage-hud">
        <button class="hud-btn" id="zoomInBtn" title="Zoom In">+</button>
        <button class="hud-btn" id="zoomOutBtn" title="Zoom Out">−</button>
        <button class="hud-btn" id="fitBtn"></button>
      </div>
      <div class="empty-overlay" id="emptyOverlay" style="display:none">
        <div class="empty-overlay-title" id="emptyTitle"></div>
        <div class="empty-overlay-sub" id="emptySub"></div>
      </div>
    </div>
  </div>

  <div id="listView" style="display:none"></div>
  <div class="legend" id="legendBar"></div>
  <div class="guest-bar" id="guestBar" style="display:none"></div>
  <div id="modalRoot"></div>
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="./iso-scene.js"></script>
  <script>
    const orcaApi = window.orca;
    let snapshot = null;
    let avatars = {};
    let viewMode = "office";
    let activeOnly = false;
    let searchQuery = "";
    let engineFilter = "all";
    let guestExpanded = false;
    let openCard = null;
    let decisionCursor = 0;
    let seenDecisionKeys = new Set();
    let hasLoadedOnce = false;
    const expandedStaleTeams = new Set();

    const I18N = {
      zh: {
        title: "AI 总部大楼",

    function getLang() {
      const pref = snapshot?.settings?.language || "auto";
      if (pref === "zh" || pref === "en") return pref;
      const loc = String(orcaApi?.locale || navigator.language || "en").toLowerCase();
      return loc.startsWith("zh") ? "zh" : "en";
    }
    function t() { return I18N[getLang()] || I18N.en; }
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function shortEng(e) { return e === "antigravity" ? "agy" : (e || "agent"); }
    function fmtDur(ms) {
      const mins = Math.max(0, Math.floor(ms / 60000));
      if (mins < 1) return "<1m";
      if (mins < 60) return `${mins}m`;
      const h = Math.floor(mins / 60);
      return `${h}h${mins % 60 ? (mins % 60) + "m" : ""}`;
    }
    function relTime(ts) {
      if (!ts) return "";
      const sec = Math.max(0, Math.floor((Date.now() - Number(ts)) / 1000));
      const tr = t();
      if (sec < 60) return tr.justNow;
      const min = Math.floor(sec / 60);
      if (min < 60) return tr.minsAgo(min);
      const hr = Math.floor(min / 60);
      if (hr < 24) return tr.hrsAgo(hr);
      return tr.daysAgo(Math.floor(hr / 24));
    }
    function isStalled(entity) {
      const touch = Math.max(Number(entity.lastActivityAt || 0), Number(entity.stateStartedAt || 0));
      return entity.state === "working" && touch > 0 && Date.now() - touch > 12 * 60 * 1000;
    }

    function showToast(msg, isAttn = false, onClick = null) {
      const wrap = document.getElementById("toastWrap");
      const el = document.createElement("div");
      el.className = `toast ${isAttn ? "attn" : ""}`;
      el.textContent = msg;
      el.addEventListener("click", () => { if (onClick) onClick(); el.remove(); });
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 5500);
    }

    async function openWorkspace(worktreeId, focusAttention = false) {
      if (!worktreeId || !orcaApi?.plugin?.request) return;
      try { await orcaApi.plugin.request("office.openWorkspace", { workspaceId: worktreeId, focusAttention }); }
      catch (err) { console.error("openWorkspace failed:", err); }
    }
    async function openTasksView() {
      if (!orcaApi?.plugin?.request) return;
      try { await orcaApi.plugin.request("office.openTasksView", {}); }
      catch (err) { console.error("openTasksView failed:", err); }
    }
    async function openExternalUrl(url) {
      if (!url) return;
      if (orcaApi?.shell?.openExternal) {
        await orcaApi.shell.openExternal(url).catch(() => {});
      }
    }

    function jumpToBotDecision(bot) {
      if (bot.selfNeedsDecision && bot.worktreeId) { void openWorkspace(bot.worktreeId, true); return; }
      const blockedW = (bot.workers || []).find((w) => w.needsDecision);
      if (blockedW?.worktreeId) { void openWorkspace(blockedW.worktreeId, true); return; }
      if (bot.worktreeId) void openWorkspace(bot.worktreeId, true);
      else void openTasksView();
    }

    // Initialize 2.5D Isometric Canvas Engine
    const isoEngine = new window.IsoOfficeEngine(document.getElementById("officeCanvas"), {
      onRedDotClick(node) {
        if (node.kind === "bot") jumpToBotDecision(node.bot);
        else if (node.worker?.worktreeId) void openWorkspace(node.worker.worktreeId, true);
      },
      onActorClick(node) {
        openCard = node.kind === "bot"
          ? { kind: "bot", id: node.bot.id }
          : { kind: "worker", worktreeId: node.worker.worktreeId };
        renderModal();
      },
      onActorDblClick(node) {
        const wid = node.kind === "bot" ? node.bot.worktreeId : node.worker.worktreeId;
        if (wid) void openWorkspace(wid, true);
      },
      onArchiveClick(botId) {
        if (expandedStaleTeams.has(botId)) expandedStaleTeams.delete(botId);
        else expandedStaleTeams.add(botId);
        render();
      },
    });

    function filterBots(rawBots) {
      const q = searchQuery.trim().toLowerCase();
      const eng = engineFilter;
      return rawBots
        .map((b) => {
          const matchBotEng = eng === "all" || String(b.agent || "").toLowerCase() === eng;
          const matchBotQ = !q || b.name.toLowerCase().includes(q) || (b.activity || "").toLowerCase().includes(q);
          const filteredWorkers = (b.workers || []).filter((w) => {
            const wEng = eng === "all" || String(w.agentType || "").toLowerCase() === eng;
            const wQ = !q || w.displayName.toLowerCase().includes(q) || (w.activity || "").toLowerCase().includes(q) || (w.branch || "").toLowerCase().includes(q);
            const wAct = !activeOnly || w.needsDecision || w.state === "working";
            return wEng && wQ && wAct;
          });
          const botActive = !activeOnly || b.needsDecision || b.state === "working" || b.workingWorkerCount > 0;
          const keep = (matchBotEng && matchBotQ && botActive) || filteredWorkers.length > 0;
          if (!keep) return null;
          return { ...b, workers: q || eng !== "all" || activeOnly ? filteredWorkers : b.workers };
        })
        .filter(Boolean);
    }

    function miniRobotBadgeHtml(w) {
      const col = w.needsDecision ? "#ef4444" : (w.state === "working" ? "#4ade80" : "#64748b");
      return `<svg viewBox="0 0 28 28" width="22" height="22">
        <rect x="4" y="6" width="20" height="16" rx="5" fill="#f8fafc" stroke="${col}" stroke-width="2"/>
        <rect x="7" y="10" width="14" height="8" rx="3" fill="#0f172a"/>
        <circle cx="11.5" cy="14" r="1.8" fill="${col}"/><circle cx="16.5" cy="14" r="1.8" fill="${col}"/>
      </svg>`;
    }

    function renderListView(bots) {
      const tr = t();
      const now = Date.now();
      const needRows = [], workRows = [], idleRows = [];

      for (const b of bots) {
        const av = avatars[b.id] || avatars[b.name];
        const avHtml = av ? `<img src="${av}" alt=""/>` : `<span style="font-weight:800">${esc((b.name || "?").slice(0, 1).toUpperCase())}</span>`;
        const bStall = isStalled(b);
        const bDur = b.state === "working" && b.stateStartedAt ? fmtDur(now - b.stateStartedAt) : "";
        const bRow = {
          attr: `data-card-bot="${esc(b.id)}" data-dblopen="${esc(b.worktreeId || "")}"`,
          jumpAttr: `data-jump-bot="${esc(b.id)}"`,
          avHtml, name: b.name, role: tr.roleBot, eng: shortEng(b.agent),
          sub: b.needsYouItems?.length ? `#${b.needsYouItems[0].number} ${b.needsYouItems[0].title}` : (b.activity || tr.stateIdle),
          attnCount: b.decisionCount || 0, needs: b.needsDecision,
          working: b.state === "working" || b.workingWorkerCount > 0,
          stall: bStall, dur: bDur, time: relTime(b.lastActivityAt),
        };
        if (bRow.needs) needRows.push(bRow);
        else if (bRow.working) workRows.push(bRow);
        else idleRows.push(bRow);

        for (const w of (b.workers || [])) {
          const wStall = isStalled(w);
          const wDur = w.state === "working" && w.stateStartedAt ? fmtDur(now - w.stateStartedAt) : "";
          const wRow = {
            attr: `data-card-worker="${esc(w.worktreeId)}" data-dblopen="${esc(w.worktreeId)}"`,
            jumpAttr: `data-jump-ws="${esc(w.worktreeId)}"`,
            avHtml: miniRobotBadgeHtml(w),
            name: w.displayName, role: tr.roleWorker(b.name), eng: shortEng(w.agentType),
            sub: w.activity || tr.stateIdle,
            attnCount: w.needsDecision ? 1 : 0, needs: w.needsDecision,
            working: w.state === "working", stall: wStall, dur: wDur, time: relTime(w.lastActivityAt),
          };
          if (wRow.needs) needRows.push(wRow);
          else if (wRow.working) workRows.push(wRow);
          else idleRows.push(wRow);
        }
      }

      const renderGrp = (title, dot, rows, attn = false) => {
        if (!rows.length) return "";
        return `
          <div class="wb-group ${attn ? "attn" : ""}">
            <div class="wb-g-head"><span class="left"><span class="cnt-dot ${dot}"></span>${esc(title)}</span><span>${rows.length}</span></div>
            ${rows.map((r) => `
              <div class="wb-row ${r.needs ? "attn" : ""}" ${r.attr}>
                <div class="wb-av">${r.avHtml}${r.needs ? `<span class="wb-av-dot">${r.attnCount > 1 ? r.attnCount : "!"}</span>` : ""}</div>
                <div class="wb-body">
                  <div class="wb-top">
                    <span class="wb-name">${esc(r.name)}</span>
                    <span class="wb-tag">${esc(r.role)}</span>
                    <span class="wb-tag eng">${esc(r.eng)}</span>
                    ${r.stall ? `<span class="wb-tag stall">⚠ ${esc(r.dur)}</span>` : (r.dur ? `<span class="wb-tag">${esc(r.dur)}</span>` : "")}
                  </div>
                  <div class="wb-sub">${esc(r.sub)}</div>
                </div>
                ${r.needs ? `<button class="wb-go-btn" ${r.jumpAttr}>${esc(tr.listGoDecide)}</button>` : `<span class="wb-time">${esc(r.time || "↗")}</span>`}
              </div>`).join("")}
          </div>`;
      };

      const html = renderGrp(tr.grpNeed, "red", needRows, true) + renderGrp(tr.grpWork, "blue", workRows) + renderGrp(tr.grpIdle, "gray", idleRows);
      const listEl = document.getElementById("listView");
      listEl.innerHTML = `<div class="workbench">${html || `<div style="text-align:center;color:var(--muted);padding:32px">${esc(tr.emptyFilter)}</div>`}</div>`;
      bindDomClickHandlers(listEl);
    }

    function findCardTarget() {
      if (!openCard || !snapshot) return null;
      const bots = snapshot.bots || [];
      if (openCard.kind === "bot") {
        const bot = bots.find((b) => b.id === openCard.id);
        return bot ? { kind: "bot", bot } : null;
      }
      if (openCard.kind === "worker") {
        for (const bot of bots) {
          const worker = (bot.workers || []).find((w) => w.worktreeId === openCard.worktreeId);
          if (worker) return { kind: "worker", worker, bot };
        }
        return null;
      }
      if (openCard.kind === "standalone") {
        const worker = (snapshot.standalone || []).find((w) => w.worktreeId === openCard.worktreeId);
        return worker ? { kind: "standalone", worker } : null;
      }
      return null;
    }

    function renderModal() {
      const root = document.getElementById("modalRoot");
      const target = findCardTarget();
      if (!target) { root.innerHTML = ""; return; }
      const tr = t();
      const now = Date.now();

      let title = "", roleText = "", engine = "", repo = "", branch = "";
      let statusCls = "idle", statusText = "", needsDec = false, lastAt = null;
      let timeline = [], links = [], avatarHtml = "", primaryWsId = null, attnWorkerWsId = null;
      let workersHtml = "", decisionsHtml = "", hasItems = false;

      if (target.kind === "bot") {
        const b = target.bot;
        title = b.name;
        roleText = tr.roleBot;
        engine = shortEng(b.agent);
        needsDec = b.needsDecision;
        lastAt = b.lastActivityAt;
        timeline = b.timeline || [];
        links = b.links || [];
        primaryWsId = b.worktreeId;
        const firstDecW = (b.workers || []).find((w) => w.needsDecision);
        if (!b.selfNeedsDecision && firstDecW) attnWorkerWsId = firstDecW.worktreeId;

        const stall = isStalled(b);
        const dur = b.state === "working" && b.stateStartedAt ? fmtDur(now - b.stateStartedAt) : "";
        if (needsDec) {
          statusCls = "attn";
          statusText = `🔴 ${(b.needsYouItems || []).length ? tr.stateNeedItem(b.needsYouItems.length) : (b.selfNeedsDecision ? tr.stateNeedPerm : tr.stateNeedWorker)}`;
        } else if (stall) {
          statusCls = "stall";
          statusText = tr.stateStall(dur);
        } else if (b.state === "working" || b.workingWorkerCount > 0) {
          statusCls = "working";
          statusText = `🔵 ${tr.stateWorking}${dur ? ` · ${tr.stateRunDur(dur)}` : ""}`;
        } else {
          statusCls = "idle";
          statusText = `💤 ${tr.stateIdle}`;
        }

        const av = avatars[b.id] || avatars[b.name];
        avatarHtml = av ? `<img src="${av}" alt=""/>` : `<span style="font-weight:800;font-size:16px">${esc((b.name || "?").slice(0, 1).toUpperCase())}</span>`;

        const items = b.needsYouItems || [];
        hasItems = items.length > 0;
        if (hasItems) {
          decisionsHtml = `
            <div class="ic-section-title">${esc(tr.secDecisions)}</div>
            ${items.map((it) => {
              const qs = it.ask?.questions || [];
              return `
                <div class="ic-decision-box">
                  <div class="ic-dec-title"><span class="ic-dec-num">#${it.number}</span><span>${esc(it.title)}</span></div>
                  ${it.ask?.context ? `<div class="ic-dec-ctx">${esc(it.ask.context)}</div>` : ""}
                  ${qs.length ? `<div class="ic-q-list">${qs.map((q, qi) => `
                    <div class="ic-q-item">
                      <div class="ic-q-prompt">${qi + 1}. ${esc(q.prompt)}</div>
                      ${(q.options || []).length ? `<div class="ic-q-opts">${q.options.map((opt, oi) => {
                        const isRec = q.recommended === oi;
                        return `<span class="ic-q-chip ${isRec ? "rec" : ""}">${isRec ? "★ " : ""}${esc(opt.label)}</span>`;
                      }).join("")}</div>` : ""}
                    </div>`).join("")}</div>` : ""}
                </div>`;
            }).join("")}`;
        }

        if ((b.workers || []).length > 0) {
          workersHtml = `
            <div class="ic-section-title">${esc(tr.secWorkers(b.workingWorkerCount, b.workers.length))}</div>
            <div class="ic-workers">
              ${b.workers.map((w) => {
                const mode = w.needsDecision ? "attn" : (w.state === "working" ? "working" : "idle");
                const wd = w.state === "working" && w.stateStartedAt ? fmtDur(now - w.stateStartedAt) : "";
                return `
                  <div class="ic-worker-row ${mode === "attn" ? "attn" : ""}" data-modal-switch-worker="${esc(w.worktreeId)}">
                    <span class="ic-w-dot ${mode}"></span>
                    <div class="ic-w-main">
                      <div class="ic-w-name">${esc(w.displayName)}${wd ? ` · ${esc(wd)}` : ""}</div>
                      <div class="ic-w-act">${esc(w.activity || tr.stateIdle)}</div>
                    </div>
                    <span class="ic-w-go" data-modal-jump="${esc(w.worktreeId)}" data-modal-attn="${w.needsDecision ? "1" : "0"}">${w.needsDecision ? "🔴 ↗" : "↗"}</span>
                  </div>`;
              }).join("")}
            </div>`;
        }
      } else {
        const w = target.worker;
        title = w.displayName;
        roleText = target.kind === "worker" ? tr.roleWorker(target.bot.name) : tr.roleStandalone;
        engine = shortEng(w.agentType);
        repo = w.repo;
        branch = w.branch;
        needsDec = w.needsDecision;
        lastAt = w.lastActivityAt;
        timeline = w.timeline || [];
        links = w.links || [];
        primaryWsId = w.worktreeId;
        avatarHtml = miniRobotBadgeHtml(w);

        const stall = isStalled(w);
        const dur = w.state === "working" && w.stateStartedAt ? fmtDur(now - w.stateStartedAt) : "";
        if (needsDec) { statusCls = "attn"; statusText = `🔴 ${tr.stateNeedPerm}`; }
        else if (stall) { statusCls = "stall"; statusText = tr.stateStall(dur); }
        else if (w.state === "working") { statusCls = "working"; statusText = `🔵 ${tr.stateWorking}${dur ? ` · ${tr.stateRunDur(dur)}` : ""}`; }
        else { statusCls = "idle"; statusText = `💤 ${tr.stateIdle}`; }
      }

      const linksHtml = links.length
        ? `<div class="ic-links">${links.map((lk) => `<button class="ic-link-chip" data-ext-url="${esc(lk.url)}">${lk.kind === "pr" ? "🔀 " : "🔗 "}${esc(lk.label)} ↗</button>`).join("")}</div>`

        ? timeline.map((row) => `<div class="ic-tl-row"><span class="ic-tl-lbl">${esc(row.label)}</span>${esc(row.text)}</div>`).join("")
        : `<div class="ic-tl-row" style="color:#94a3b8">${esc(tr.noActivity)}</div>`;

      const primaryLabel = needsDec && !attnWorkerWsId
        ? (target.kind === "bot" ? tr.btnGoDecide : tr.btnGoWorker)

      const primaryBtn = primaryWsId
        ? `<button class="ic-btn ${needsDec && !attnWorkerWsId ? "primary-attn" : ""}" id="icOpenBtn">${esc(primaryLabel)}</button>`

        ? `<button class="ic-btn primary-attn" id="icJumpAttnWorkerBtn">${esc(tr.btnGoWorker)}</button>`
        : "";
      const tasksBtn = hasItems ? `<button class="ic-btn secondary" id="icTasksBtn">${esc(tr.btnOpenTasks)}</button>` : "";

      root.innerHTML = `
        <div class="card-backdrop" id="cardBackdrop">

            <div class="ic-status-bar ${statusCls}">
              <span>${esc(statusText)}</span>
              ${lastAt ? `<span class="ic-time">${esc(relTime(lastAt))}</span>` : ""}
            </div>
            ${linksHtml}
            ${decisionsHtml}
            <div class="ic-section-title">${esc(tr.secTimeline)}</div>
            <div class="ic-timeline">${timelineHtml}</div>
            ${workersHtml}
            <div class="ic-actions">
              <button class="ic-btn secondary" id="icDismissBtn">${esc(tr.btnClose)}</button>
              ${tasksBtn}
              ${jumpAttnWorkerBtn}
              ${primaryBtn}
            </div>
          </div>
        </div>`;

      const close = () => { openCard = null; renderModal(); };
      document.getElementById("cardBackdrop")?.addEventListener("click", (e) => { if (e.target.id === "cardBackdrop") close(); });
      document.getElementById("icCloseBtn")?.addEventListener("click", close);
      document.getElementById("icDismissBtn")?.addEventListener("click", close);
      document.getElementById("icOpenBtn")?.addEventListener("click", () => { if (primaryWsId) void openWorkspace(primaryWsId, needsDec); close(); });
      document.getElementById("icJumpAttnWorkerBtn")?.addEventListener("click", () => { if (attnWorkerWsId) void openWorkspace(attnWorkerWsId, true); close(); });
      document.getElementById("icTasksBtn")?.addEventListener("click", () => { void openTasksView(); close(); });
      document.getElementById("icCopyBranch")?.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(branch); showToast(tr.copiedBranch(branch)); } catch {}
      });
      document.querySelectorAll("[data-ext-url]").forEach((el) => {
        el.addEventListener("click", () => void openExternalUrl(el.getAttribute("data-ext-url")));
      });
      document.querySelectorAll("[data-modal-switch-worker]").forEach((el) => {
        el.addEventListener("click", () => { openCard = { kind: "worker", worktreeId: el.getAttribute("data-modal-switch-worker") }; renderModal(); });
      });
      document.querySelectorAll("[data-modal-jump]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const wid = el.getAttribute("data-modal-jump");
          if (wid) void openWorkspace(wid, el.getAttribute("data-modal-attn") === "1");
          close();
        });
      });
    }

    function bindDomClickHandlers(container) {
      container.querySelectorAll("[data-jump-bot]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const bot = (snapshot?.bots || []).find((b) => b.id === el.getAttribute("data-jump-bot"));
          if (bot) jumpToBotDecision(bot);
        });
      });
      container.querySelectorAll("[data-jump-ws]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const wid = el.getAttribute("data-jump-ws");
          if (wid) void openWorkspace(wid, true);
        });
      });
      container.querySelectorAll("[data-card-bot]").forEach((el) => {
        el.addEventListener("click", (e) => { e.stopPropagation(); openCard = { kind: "bot", id: el.getAttribute("data-card-bot") }; renderModal(); });
        el.addEventListener("dblclick", (e) => { e.stopPropagation(); const w = el.getAttribute("data-dblopen"); if (w) void openWorkspace(w, true); });
      });
      container.querySelectorAll("[data-card-worker]").forEach((el) => {
        el.addEventListener("click", (e) => { e.stopPropagation(); openCard = { kind: "worker", worktreeId: el.getAttribute("data-card-worker") }; renderModal(); });
        el.addEventListener("dblclick", (e) => { e.stopPropagation(); const w = el.getAttribute("data-dblopen"); if (w) void openWorkspace(w, true); });
      });
      container.querySelectorAll("[data-card-standalone]").forEach((el) => {
        el.addEventListener("click", (e) => { e.stopPropagation(); openCard = { kind: "standalone", worktreeId: el.getAttribute("data-card-standalone") }; renderModal(); });
        el.addEventListener("dblclick", (e) => { e.stopPropagation(); const w = el.getAttribute("data-dblopen"); if (w) void openWorkspace(w, true); });
      });
    }

    function detectNewDecisions(snap) {
      const tr = t();
      const currentKeys = new Set();
      for (const item of (snap.decisionList || [])) {
        const key = `${item.kind}:${item.id || item.worktreeId}:${item.itemNumber || ""}`;
        currentKeys.add(key);
        if (hasLoadedOnce && !seenDecisionKeys.has(key)) {
          showToast(tr.toastNewDecision(item.name, item.title || tr.stateNeed), true, () => {
            if (item.worktreeId) void openWorkspace(item.worktreeId, true);
          });
        }
      }
      seenDecisionKeys = currentKeys;
      hasLoadedOnce = true;
    }

    function render() {
      const tr = t();
      document.getElementById("brandTitle").textContent = tr.title;
      document.getElementById("liveLabel").textContent = tr.live;
      document.getElementById("cntNeedLbl").textContent = tr.needLbl;
      document.getElementById("cntWorkLbl").textContent = tr.workLbl;
      document.getElementById("cntIdleLbl").textContent = tr.idleLbl;
      document.getElementById("viewOfficeBtn").textContent = tr.tabOffice;
      document.getElementById("viewListBtn").textContent = tr.tabList;
      document.getElementById("searchInput").placeholder = tr.searchPh;
      document.getElementById("engFilter").options[0].textContent = tr.allEng;
      document.getElementById("activeOnlyBtn").textContent = tr.activeOnly;
      document.getElementById("refreshBtn").textContent = tr.refresh;
      document.getElementById("fitBtn").textContent = tr.fit;
      document.getElementById("stageHint").textContent = tr.hint;
      document.getElementById("viewOfficeBtn").classList.toggle("active", viewMode === "office");
      document.getElementById("viewListBtn").classList.toggle("active", viewMode === "list");

      if (!snapshot) return;
      const s = snapshot.summary || {};
      const needCount = s.decisionCount || 0;
      const workCount = (s.workingBots || 0) + (s.workingWorkers || 0);
      const idleCount = s.idleTotal || 0;

      document.getElementById("cntNeedVal").textContent = needCount;
      document.getElementById("cntWorkVal").textContent = workCount;
      document.getElementById("cntIdleVal").textContent = idleCount;
      document.getElementById("cntNeed").classList.toggle("has-need", needCount > 0);

      const bots = filterBots(snapshot.bots || []);
      const officeWrap = document.getElementById("officeView");
      const listWrap = document.getElementById("listView");

      if (viewMode === "list") {
        officeWrap.style.display = "none";
        listWrap.style.display = "block";
        isoEngine.pause();
        renderListView(bots);
      } else {
        officeWrap.style.display = "block";
        listWrap.style.display = "none";
        isoEngine.resize();

        const soloInLounge = snapshot.settings?.soloBotsInLounge !== false;
        const teamBots = [];
        const soloBots = [];
        for (const b of bots) {
          if (!soloInLounge || (b.workers && b.workers.length > 0)) teamBots.push(b);
          else soloBots.push(b);
        }
        teamBots.sort((a, b) => {
          const sc = (x) => (x.needsDecision ? 1000 : 0) + (x.workingWorkerCount * 20) + (x.state === "working" ? 10 : 0) + (x.workers.length > 0 ? 2 : 0);
          return sc(b) - sc(a);
        });

        const emptyEl = document.getElementById("emptyOverlay");
        if (bots.length === 0) {
          emptyEl.style.display = "block";
          document.getElementById("emptyTitle").textContent = (snapshot.bots || []).length ? tr.emptyFilter : tr.emptyTitle;
          document.getElementById("emptySub").textContent = (snapshot.bots || []).length ? "" : tr.emptySub;
        } else {
          emptyEl.style.display = "none";
        }

        isoEngine.setData({
          teamBots,
          soloBots,
          mailLinks: snapshot.mailLinks || [],
          expandedStaleTeams,
          staleHours: Number(snapshot.settings?.hideStaleIdleHours ?? 24),
          lang: getLang(),
        });
      }

      document.getElementById("legendBar").innerHTML = `
        <div class="legend-grp">
          <span class="lg-item"><span class="lg-dot" style="background:#ef4444"></span>${esc(tr.legendNeed)}</span>
          <span class="lg-item"><span class="lg-dot" style="background:#38bdf8"></span>${esc(tr.legendWork)}</span>
          <span class="lg-item"><span class="lg-dot" style="background:#fbbf24"></span>${esc(tr.legendStall)}</span>
          <span class="lg-item">✉️ ${esc(tr.legendMail)}</span>
        </div>
        <div class="legend-grp">
          <span class="lg-item"><span class="lg-dot" style="background:#f59e0b"></span>Claude</span>
          <span class="lg-item"><span class="lg-dot" style="background:#38bdf8"></span>agy</span>
          <span class="lg-item"><span class="lg-dot" style="background:#a78bfa"></span>Codex</span>
          <span class="lg-item"><span class="lg-dot" style="background:#94a3b8"></span>Pi</span>
        </div>`;

      const standalone = snapshot.standalone || [];
      const guestBar = document.getElementById("guestBar");
      if (!standalone.length) {
        guestBar.style.display = "none";
      } else {
        guestBar.style.display = "block";
        const activeG = standalone.filter((w) => w.state === "working" || w.needsDecision).length;
        const listHtml = guestExpanded
          ? `<div class="guest-list">${standalone.map((w) => `
              <span class="guest-chip ${w.needsDecision ? "attn" : ""}" data-card-standalone="${esc(w.worktreeId)}" data-dblopen="${esc(w.worktreeId)}">
                ${w.needsDecision ? "🔴" : (w.state === "working" ? "🟢" : "🪑")} ${esc(w.displayName)}
              </span>`).join("")}</div>`
          : "";
        guestBar.innerHTML = `
          <div class="guest-head" id="guestToggle">
            <span>${esc(tr.guestBar(activeG, standalone.length))}</span>
            <span>${esc(guestExpanded ? tr.collapse : tr.expand)}</span>
          </div>${listHtml}`;
        document.getElementById("guestToggle")?.addEventListener("click", () => { guestExpanded = !guestExpanded; render(); });
        bindDomClickHandlers(guestBar);
      }

      if (openCard) renderModal();
    }

    async function loadAll(force = false) {
      if (!orcaApi?.plugin?.request) return;
      try {
        const [snap, avs] = await Promise.all([
          orcaApi.plugin.request("office.getSnapshot", { force }),
          Object.keys(avatars).length ? Promise.resolve(avatars) : orcaApi.plugin.request("office.getAvatars", {}),
        ]);
        if (avs) { avatars = avs; isoEngine.setAvatars(avs); }
        if (snap) { snapshot = snap; detectNewDecisions(snap); }
        render();
      } catch (err) {
        console.error("loadAll failed:", err);
      }
    }

    document.getElementById("viewOfficeBtn").addEventListener("click", () => { viewMode = "office"; render(); });
    document.getElementById("viewListBtn").addEventListener("click", () => { viewMode = "list"; render(); });
    document.getElementById("refreshBtn").addEventListener("click", () => void loadAll(true));
    document.getElementById("activeOnlyBtn").addEventListener("click", (e) => {
      activeOnly = !activeOnly;
      e.currentTarget.classList.toggle("active", activeOnly);
      render();
    });
    document.getElementById("searchInput").addEventListener("input", (e) => { searchQuery = e.target.value; render(); });
    document.getElementById("engFilter").addEventListener("change", (e) => { engineFilter = e.target.value; render(); });
    document.getElementById("zoomInBtn").addEventListener("click", () => {
      isoEngine.zoom = Math.min(2.1, isoEngine.zoom * 1.15);
      isoEngine.bgDirty = true; isoEngine.drawNow();
    });
    document.getElementById("zoomOutBtn").addEventListener("click", () => {
      isoEngine.zoom = Math.max(0.55, isoEngine.zoom * 0.87);
      isoEngine.bgDirty = true; isoEngine.drawNow();
    });
    document.getElementById("fitBtn").addEventListener("click", () => { isoEngine.fitCamera(); isoEngine.drawNow(); });

    document.getElementById("cntNeed").addEventListener("click", () => {
      const list = snapshot?.decisionList || [];
      if (!list.length) return;
      const item = list[decisionCursor % list.length];
      decisionCursor += 1;
      openCard = item.kind === "bot"
        ? { kind: "bot", id: item.id }
        : { kind: "worker", worktreeId: item.worktreeId };
      renderModal();
    });
    window.addEventListener("keydown", (e) => { if (e.key === "Escape" && openCard) { openCard = null; renderModal(); } });
    window.addEventListener("resize", () => { if (viewMode === "office") isoEngine.resize(); });

    if (orcaApi?.plugin?.on) {
      orcaApi.plugin.on("office.snapshot", (snap) => {
        if (snap) { snapshot = snap; detectNewDecisions(snap); render(); }
      });
    }
    if (orcaApi?.on) { orcaApi.on("theme", () => render()); }

    window.__botOfficeInjectMock = (mockSnap, mockAvatars = {}) => {
      snapshot = mockSnap;
      avatars = mockAvatars;
      isoEngine.setAvatars(mockAvatars);
      render();
    };
    window.__botOfficeOpenCard = (cardSpec) => { openCard = cardSpec; renderModal(); };
    window.__botOfficeSetView = (mode) => { viewMode = mode; render(); };

    isoEngine.resize();
    void loadAll(false);
  </script>
</body>
</html>
