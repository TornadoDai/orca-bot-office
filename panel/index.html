<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot Office</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0b0e14;
      --card: #131924;
      --card-elev: #172030;
      --border: rgba(255, 255, 255, 0.11);
      --fg: #eef2f7;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --green: #4ade80;
      --amber: #fbbf24;
      --red: #ef4444;
      --purple: #c084fc;
    }
    html.light {
      --bg: #dfe6f0;
      --card: #ffffff;
      --card-elev: #f8fafc;
      --border: rgba(30, 41, 59, 0.14);
      --fg: #1e293b;
      --muted: #64748b;
    }
    body {
      margin: 0;
      padding: 6px 8px 18px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--orca-font-sans, -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif);
      font-size: 12px;
      user-select: none;
    }

    /* Sticky Roof Header */
    .roofbar {
      position: sticky;
      top: 0;
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 10px;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #1b2334, #121826);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px 10px 5px 5px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
    }
    .brand { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }
    .brand-title { font-weight: 800; font-size: 12.5px; color: #f8fafc; white-space: nowrap; }
    .brand-stat { font-size: 11px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-stat b { color: #38bdf8; }
    .brand-stat b.g { color: #4ade80; }

    .top-btns { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .btn {
      border: 1px solid rgba(148, 163, 184, 0.26);
      background: rgba(15, 23, 42, 0.65);
      color: #e2e8f0;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover, .btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(56, 189, 248, 0.14); }
    .btn-attn {
      border: 1px solid rgba(239, 68, 68, 0.72);
      background: rgba(239, 68, 68, 0.2);
      color: #fecaca;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      animation: attnGlow 1.8s ease-in-out infinite;
    }
    .btn-attn:hover { background: rgba(239, 68, 68, 0.34); color: #fff; border-color: #f87171; }
    .btn-attn-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }

    /* Cutaway HQ Building Shell */
    .building {
      display: flex;
      flex-direction: column;
      border: 3px solid #283246;
      border-radius: 11px;
      overflow: hidden;
      background: #141923;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
    }

    /* Each Story = Architectural Cutaway Room */
    .floor-story {
      position: relative;
      width: 100%;
      border-bottom: 7px solid #1e2536;
      overflow: hidden;
      background: #181c24;
    }
    .floor-story:last-child { border-bottom: none; }
    .floor-story::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 35;
      pointer-events: none;
    }
    .floor-story::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, #0d111a, #37435c, #0d111a);
      z-index: 35;
      pointer-events: none;
    }

    .floor-bg-svg {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 10;
    }
    .floor-actors {
      position: absolute; inset: 0; z-index: 20; pointer-events: none;
    }
    .floor-fg-svg {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 24; pointer-events: none;
    }
    .floor-labels {
      position: absolute; inset: 0; z-index: 30; pointer-events: none;
    }

    /* Architectural Floor Sign */
    .floor-sign {
      position: absolute;
      top: 5px; left: 8px; z-index: 36;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 7px 2px 5px;
      border-radius: 5px;
      background: rgba(10, 14, 24, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    .f-num {
      font-size: 9.5px; font-weight: 800; font-family: ui-monospace, monospace;
      color: #fbbf24; background: rgba(251, 191, 36, 0.16); padding: 0 4px; border-radius: 3px;
    }
    .f-name { font-size: 10.5px; font-weight: 700; color: #f1f5f9; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .f-badge {
      position: absolute;
      top: 5px; right: 8px; z-index: 36;
      font-size: 9.5px; font-weight: 700;
      padding: 2px 7px; border-radius: 999px;
      background: rgba(10, 14, 24, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.26);
      color: #94a3b8;
      pointer-events: none;
    }
    .f-badge.hot { color: #4ade80; border-color: rgba(74, 222, 128, 0.5); background: rgba(6, 78, 59, 0.75); }
    .f-badge.attn { color: #fecaca; border-color: rgba(239, 68, 68, 0.72); background: rgba(127, 29, 29, 0.82); }

    /* Seated Characters (Behind wooden desks) */
    .actor {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex; flex-direction: column; align-items: center;
      pointer-events: auto;
      cursor: pointer;
    }
    .actor:hover .actor-head { transform: scale(1.1); }

    .actor-body { position: relative; display: flex; flex-direction: column; align-items: center; }
    .actor.is-working .actor-body { animation: typingBob 1.1s ease-in-out infinite; }
    .actor.is-attn .actor-body { animation: alertHop 1.5s ease-in-out infinite; }
    .actor.is-idle .actor-body { animation: chillBreathe 3.2s ease-in-out infinite; }

    .actor-head {
      width: 34px; height: 34px; border-radius: 11px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.28);
      background: #1e293b;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s, box-shadow 0.2s;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 14px;
      z-index: 2;
    }
    .actor-head img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .actor.is-working .actor-head {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.72), 0 3px 8px rgba(0, 0, 0, 0.5);
    }
    .actor.is-attn .actor-head {
      border-color: #ef4444;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.85), 0 3px 8px rgba(0, 0, 0, 0.5);
    }
    .actor.is-idle .actor-head {
      width: 31px; height: 31px; border-radius: 10px;
      filter: brightness(0.9) saturate(0.88);
    }

    .actor.is-worker .actor-head {
      width: 36px; height: 44px; border-radius: 0;
      background: transparent; border: none; box-shadow: none; overflow: visible;
    }
    .actor.is-worker.is-attn .actor-head {
      filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.9));
    }

    /* Seated Shoulders tucked behind wooden desktop */
    .actor-torso {
      width: 32px; height: 18px; margin-top: -4px;
      border-radius: 12px 12px 2px 2px;
      background: linear-gradient(180deg, #3b4b63, #232f42);
      border: 1px solid rgba(255, 255, 255, 0.16);
      position: relative; z-index: 1;
    }
    .actor-torso::after {
      content: ""; position: absolute; top: 1px; left: 50%; transform: translateX(-50%);
      width: 6px; height: 8px; border-radius: 0 0 3px 3px; background: rgba(255, 255, 255, 0.25);
    }
    .actor.is-working .actor-torso { background: linear-gradient(180deg, #0284c7, #1e3a5f); }
    .actor.is-attn .actor-torso { background: linear-gradient(180deg, #dc2626, #7f1d1d); }
    .actor.is-worker .actor-torso { display: none; }

    /* Red Notification Dot right on top of character's head when user is needed! */
    .head-red-dot {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      border-radius: 999px;
      background: #ef4444;
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.95), 0 2px 5px rgba(0, 0, 0, 0.55);
      pointer-events: auto;
      cursor: pointer;
      z-index: 38;
    }
    .head-red-dot::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 999px;
      border: 2px solid rgba(239, 68, 68, 0.8);
      animation: redPing 1.4s cubic-bezier(0, 0, 0.2, 1) infinite;
      pointer-events: none;
    }

    /* Floating Speech Bubbles */
    .bubble {
      position: absolute;
      transform: translate(-50%, -100%);
      max-width: 136px;
      padding: 2px 7px;
      border-radius: 7px;
      font-size: 9px; font-weight: 600; line-height: 1.25;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      background: rgba(10, 16, 28, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.65);
      color: #e0f2fe;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      cursor: pointer;
    }
    .bubble.worker {
      border-color: rgba(74, 222, 128, 0.72);
      background: rgba(6, 46, 36, 0.92);
      color: #dcfce7;
      max-width: 120px;
    }
    .bubble.attn {
      border-color: rgba(239, 68, 68, 0.85);
      background: rgba(127, 29, 29, 0.94);
      color: #fee2e2;
    }

    /* Desk Front Nameplate */
    .nameplate {
      position: absolute;
      transform: translate(-50%, 0);
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(12, 16, 26, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f8fafc;
      font-size: 9px; font-weight: 700;
      white-space: nowrap; max-width: 106px; overflow: hidden; text-overflow: ellipsis;
      pointer-events: auto; cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);
    }
    .nameplate.worker-hot { border-color: rgba(74, 222, 128, 0.65); color: #86efac; background: rgba(6, 38, 30, 0.92); }
    .nameplate.boss-hot { border-color: rgba(56, 189, 248, 0.6); color: #e0f2fe; }
    .nameplate.attn { border-color: rgba(239, 68, 68, 0.85); color: #fecaca; background: rgba(127, 29, 29, 0.9); }
    .nameplate.idle { color: #cbd5e1; opacity: 0.92; }

    .fx-z {
      position: absolute; top: -6px; right: -8px;
      font-size: 9px; font-weight: 800; color: #e9d5ff;
      text-shadow: 0 0 6px rgba(192, 132, 252, 0.95);
      animation: floatZ 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    /* Guest Bar (B1 Standalone Workspaces) */
    .guest-bar {
      margin-top: 7px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 6px 10px;
    }
    .guest-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer;
    }
    .guest-list { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
    .guest-chip {
      padding: 3px 8px; border-radius: 6px; font-size: 10.5px;
      background: rgba(148, 163, 184, 0.1); border: 1px solid var(--border);
      color: var(--fg); cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .guest-chip:hover { border-color: var(--cyan); color: var(--cyan); }
    .guest-chip.attn { border-color: rgba(239, 68, 68, 0.65); color: #fecaca; background: rgba(239, 68, 68, 0.14); }

    /* Popover Inspector Card Overlay (Triggered when clicking any Bot or Worker!) */
    .card-backdrop {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: rgba(5, 8, 15, 0.62);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      animation: fadeIn 0.14s ease-out;
    }
    .inspector-card {
      width: 100%;
      max-width: 390px;
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      background: #141c2c;
      color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 14px;
      box-shadow: 0 22px 56px rgba(0, 0, 0, 0.68), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      padding: 14px;
      animation: popIn 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .inspector-card.is-attn {
      border-color: rgba(239, 68, 68, 0.72);
      box-shadow: 0 22px 56px rgba(0, 0, 0, 0.72), 0 0 28px rgba(239, 68, 68, 0.22);
    }
    .ic-head {
      display: flex; align-items: center; gap: 10px;
    }
    .ic-av {
      position: relative;
      width: 44px; height: 44px; border-radius: 12px;
      background: #1e293b; border: 1.5px solid rgba(255, 255, 255, 0.18);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: visible;
    }
    .ic-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
    .ic-av-dot {
      position: absolute; top: -5px; right: -5px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #ef4444; border: 2px solid #141c2c;
      box-shadow: 0 0 8px #ef4444;
    }
    .ic-title-wrap { min-width: 0; flex: 1; }
    .ic-name {
      font-size: 14px; font-weight: 800; color: #f8fafc;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ic-meta {
      margin-top: 2px;
      display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
      font-size: 10.5px; color: #94a3b8;
    }
    .ic-pill {
      padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 700;
      background: rgba(148, 163, 184, 0.14); color: #cbd5e1;
    }
    .ic-pill.eng { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; }
    .ic-close {
      width: 26px; height: 26px; border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(15, 23, 42, 0.6); color: #cbd5e1;
      font-size: 15px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ic-close:hover { background: rgba(148, 163, 184, 0.2); color: #fff; }

    .ic-status-bar {
      margin-top: 11px;
      padding: 7px 10px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 11.5px; font-weight: 700;
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .ic-status-bar.attn {
      background: rgba(127, 29, 29, 0.48);
      border-color: rgba(239, 68, 68, 0.55);
      color: #fecaca;
    }
    .ic-status-bar.working {
      background: rgba(6, 78, 59, 0.42);
      border-color: rgba(74, 222, 128, 0.42);
      color: #bbf7d0;
    }
    .ic-status-bar.idle { color: #cbd5e1; }
    .ic-time { font-size: 10.5px; font-weight: 500; opacity: 0.85; white-space: nowrap; }

    .ic-section-title {
      margin: 11px 0 5px;
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      color: #94a3b8;
    }
    .ic-task-box {
      background: rgba(9, 13, 23, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 9px;
      padding: 9px 10px;
      font-size: 11.5px;
      line-height: 1.5;
      color: #e2e8f0;
      word-break: break-word;
      user-select: text;
    }
    .ic-task-line + .ic-task-line {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed rgba(148, 163, 184, 0.16);
      color: #94a3b8;
      font-size: 11px;
    }

    .ic-workers {
      display: flex; flex-direction: column; gap: 5px;
      max-height: 165px; overflow-y: auto;
    }
    .ic-worker-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 8px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.16);
      cursor: pointer;
    }
    .ic-worker-row:hover { border-color: rgba(56, 189, 248, 0.55); background: rgba(30, 41, 59, 0.85); }
    .ic-worker-row.attn { border-color: rgba(239, 68, 68, 0.55); background: rgba(127, 29, 29, 0.25); }
    .ic-w-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #64748b; }
    .ic-w-dot.working { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .ic-w-dot.attn { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    .ic-w-main { min-width: 0; flex: 1; }
    .ic-w-name { font-size: 11px; font-weight: 700; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ic-w-act { font-size: 10px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ic-w-go { font-size: 10.5px; color: #7dd3fc; font-weight: 700; flex-shrink: 0; }

    .ic-actions {
      margin-top: 12px;
      display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
    }
    .ic-btn {
      border-radius: 8px;
      padding: 7px 13px;
      font-size: 11.5px; font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.2);
      color: #e0f2fe;
    }
    .ic-btn:hover { background: rgba(56, 189, 248, 0.34); }
    .ic-btn.primary-attn {
      border-color: #f87171;
      background: linear-gradient(180deg, #ef4444, #dc2626);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.45);
    }
    .ic-btn.primary-attn:hover { filter: brightness(1.08); }
    .ic-btn.secondary {
      border-color: rgba(148, 163, 184, 0.28);
      background: rgba(30, 41, 59, 0.7);
      color: #cbd5e1;
    }
    .ic-btn.secondary:hover { border-color: rgba(148, 163, 184, 0.55); color: #fff; }

    /* Empty State Overlay inside Empty Office */
    .empty-note {
      position: absolute;
      left: 50%; top: 52%; transform: translate(-50%, -50%);
      z-index: 35;
      background: rgba(12, 17, 29, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 10px;
      padding: 10px 16px;
      text-align: center;
      backdrop-filter: blur(6px);
      max-width: 82%;
    }
    .empty-note-title { font-size: 12.5px; font-weight: 800; color: #f8fafc; margin-bottom: 3px; }
    .empty-note-sub { font-size: 11px; color: #94a3b8; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes attnGlow { 0%, 100% { box-shadow: 0 0 0 rgba(239,68,68,0); } 50% { box-shadow: 0 0 12px rgba(239,68,68,0.55); } }
    @keyframes redPing { 0% { transform: scale(0.95); opacity: 0.9; } 100% { transform: scale(1.75); opacity: 0; } }
    @keyframes typingBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes alertHop { 0%, 75%, 100% { transform: translateY(0); } 82% { transform: translateY(-4px); } 90% { transform: translateY(0); } }
    @keyframes chillBreathe { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
    @keyframes floatZ { 0% { opacity: 0; transform: translate(0, 2px); } 45% { opacity: 0.95; } 100% { opacity: 0; transform: translate(5px, -7px); } }
    @keyframes beamMove { to { stroke-dashoffset: -20; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.94) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .wire-flow { stroke-dasharray: 5 5; animation: beamMove 0.8s linear infinite; }
  </style>
</head>
<body>
  <div class="roofbar">
    <div class="brand">
      <span class="live-dot"></span>
      <span class="brand-title" id="brandTitle">🏢 Bot Office</span>
      <span class="brand-stat" id="topStat">…</span>
    </div>
    <div class="top-btns">
      <button class="btn btn-attn" id="attnQuickBtn" style="display:none"><span class="btn-attn-dot"></span><span id="attnQuickText"></span></button>
      <button class="btn" id="activeOnlyBtn"></button>

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h);
    }
    function pickTheme(bot) {
      const key = String(bot.id || bot.name || "bot");
      return STUDIO_THEMES[hashString(key) % STUDIO_THEMES.length];
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({

      }[c]));
    }
    function shortEng(e) { return e === "antigravity" ? "agy" : (e || "agent"); }

      if (!ts) return "";
      const sec = Math.max(0, Math.floor((Date.now() - Number(ts)) / 1000));
      const tr = t();
      if (sec < 60) return tr.justNow;
      const min = Math.floor(sec / 60);
      if (min < 60) return tr.minsAgo(min);
      const hr = Math.floor(min / 60);
      if (hr < 24) return tr.hrsAgo(hr);
      return tr.daysAgo(Math.floor(hr / 24));
    }

    function classifyBot(b) {
      const tr = t();
      if (b.needsAttention) {

            ? tr.stateNeedWorker
            : tr.stateNeedPerm;
        return { mode: "attn", hot: true, label: tr.stateNeed, reason, bubble: b.activity || reason };

      if (b.state === "working" || b.workingWorkerCount > 0) {
        return { mode: "working", hot: true, label: tr.stateWorking, reason: tr.stateWorking, bubble: b.activity };
      }
      return { mode: "idle", hot: false, label: tr.stateIdle, reason: tr.stateIdle, bubble: "" };
    }

    function findCardTarget() {
      if (!openCard || !snapshot) return null;
      const bots = snapshot.bots || [];
      if (openCard.kind === "bot") {
        const bot = bots.find((b) => b.id === openCard.id);
        return bot ? { kind: "bot", bot } : null;
      }
      if (openCard.kind === "worker") {
        for (const bot of bots) {
          const worker = (bot.workers || []).find((w) => w.worktreeId === openCard.worktreeId);
          if (worker) return { kind: "worker", worker, bot };
        }
        return null;
      }
      if (openCard.kind === "standalone") {
        const worker = (snapshot.standalone || []).find((w) => w.worktreeId === openCard.worktreeId);
        return worker ? { kind: "standalone", worker } : null;
      }
      return null;
    }

      const root = document.getElementById("modalRoot");
      const target = findCardTarget();
      if (!target) {
        root.innerHTML = "";
        return;

      const tr = t();

      let title = "";

      let engine = "";

        const firstAttnW = (b.workers || []).find((w) => w.needsAttention);

        branch = w.branch;
        statusCls = ws.mode;
        statusText = ws.mode === "attn" ? `🔴 ${ws.reason}` : (ws.mode === "working" ? `🟢 ${ws.label}` : `💤 ${ws.label}`);
        needsAttn = w.needsAttention;
        lastAt = w.lastActivityAt;
        details = (w.details && w.details.length) ? w.details : (w.activity ? [w.activity] : []);
        primaryWsId = w.worktreeId;
        avatarHtml = miniWorkerRobotSvg(w, 32);
      }

      const taskHtml = details.length
        ? details.map((line) => `<div class="ic-task-line">${esc(line)}</div>`).join("")
        : `<div class="ic-task-line" style="color:#94a3b8">${esc(tr.noActivity)}</div>`;

      const primaryBtn = primaryWsId
        ? `<button class="ic-btn ${needsAttn && !attnWorkerWsId ? "primary-attn" : ""}" id="icOpenBtn">${esc(needsAttn && !attnWorkerWsId ? tr.btnHandleNow : tr.btnOpenWs)}</button>`
        : "";
      const jumpAttnWorkerBtn = attnWorkerWsId
        ? `<button class="ic-btn primary-attn" id="icJumpAttnWorkerBtn">${esc(tr.btnHandleWorker)}</button>`
        : "";

      root.innerHTML = `
        <div class="card-backdrop" id="cardBackdrop">
          <div class="inspector-card ${needsAttn ? "is-attn" : ""}" id="inspectorCard">
            <div class="ic-head">
              <div class="ic-av">
                ${avatarHtml}
                ${needsAttn ? `<span class="ic-av-dot"></span>` : ""}
              </div>
              <div class="ic-title-wrap">
                <div class="ic-name">${esc(title)}</div>
                <div class="ic-meta">
                  <span class="ic-pill">${esc(roleText)}</span>
                  <span class="ic-pill eng">${esc(engine)}</span>
                  ${repo ? `<span class="ic-pill">${esc(repo)}</span>` : ""}
                  ${branch ? `<span class="ic-pill">${esc(branch)}</span>` : ""}
                </div>
              </div>
              <button class="ic-close" id="icCloseBtn" title="${esc(tr.btnClose)}">×</button>
            </div>

            <div class="ic-status-bar ${statusCls}">
              <span>${esc(statusText)}</span>
              ${lastAt ? `<span class="ic-time">${esc(relTime(lastAt))}</span>` : ""}
            </div>

            <div class="ic-section-title">${esc(tr.secActivity)}</div>
            <div class="ic-task-box">${taskHtml}</div>

            ${workersHtml}

            <div class="ic-actions">
              <button class="ic-btn secondary" id="icDismissBtn">${esc(tr.btnClose)}</button>
              ${jumpAttnWorkerBtn}
              ${primaryBtn}
            </div>
          </div>
        </div>`;

      const close = () => { openCard = null; renderModal(); };
      document.getElementById("cardBackdrop")?.addEventListener("click", (e) => {
        if (e.target.id === "cardBackdrop") close();
      });
      document.getElementById("icCloseBtn")?.addEventListener("click", close);
      document.getElementById("icDismissBtn")?.addEventListener("click", close);
      document.getElementById("icOpenBtn")?.addEventListener("click", () => {
        if (primaryWsId) void openWorkspace(primaryWsId, needsAttn);
        close();
      });
      document.getElementById("icJumpAttnWorkerBtn")?.addEventListener("click", () => {
        if (attnWorkerWsId) void openWorkspace(attnWorkerWsId, true);
        close();
      });
      document.querySelectorAll("[data-modal-switch-worker]").forEach((el) => {
        el.addEventListener("click", () => {
          openCard = { kind: "worker", worktreeId: el.getAttribute("data-modal-switch-worker") };
          renderModal();
        });
      });
      document.querySelectorAll("[data-modal-jump]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          const wid = el.getAttribute("data-modal-jump");
          const isA = el.getAttribute("data-modal-attn") === "1";
          if (wid) void openWorkspace(wid, isA);
          close();
        });
      });
    }

    function render() {
      const tr = t();
      document.getElementById("brandTitle").textContent = tr.title;
      document.getElementById("activeOnlyBtn").textContent = tr.activeOnly;
      document.getElementById("refreshBtn").textContent = tr.refresh;
      if (!snapshot) return;

      const s = snapshot.summary || {};
      document.getElementById("topStat").innerHTML =
        tr.stat(s.workingBots || 0, s.totalBots || 0, s.workingWorkers || 0, s.totalWorkers || 0);

      const attnList = snapshot.attentionList || [];
      const attnBtn = document.getElementById("attnQuickBtn");
      if (attnList.length > 0) {
        attnBtn.style.display = "inline-flex";
        document.getElementById("attnQuickText").textContent = tr.needYouShort(attnList.length);
      } else {
        attnBtn.style.display = "none";
      }

      const bots = snapshot.bots || [];
      const soloInLounge = snapshot.settings?.soloBotsInLounge !== false;

      let html = "";
      if (bots.length === 0) {
        html = renderEmptyOffice();
      } else {
        const teamBots = [];
        const soloBots = [];
        for (const b of bots) {
          if (!soloInLounge || (b.workers && b.workers.length > 0)) teamBots.push(b);
          else soloBots.push(b);
        }
        teamBots.sort((a, b) => {
          const sc = (x) =>
            (x.needsAttention ? 1000 : 0)
            + (x.workingWorkerCount * 20)
            + (x.state === "working" ? 10 : 0)
            + (x.workers.length > 0 ? 2 : 0);
          return sc(b) - sc(a);
        });

        const shownTeams = activeOnly
          ? teamBots.filter((b) => classifyBot(b).hot || b.workingWorkerCount > 0)
          : teamBots;
        const showLounge = soloBots.length > 0 && (!activeOnly || soloBots.some((b) => classifyBot(b).hot));

        const totalStories = shownTeams.length + (showLounge ? 1 : 0);
        html = shownTeams.map((b, i) => renderTeamFloor(b, totalStories - i)).join("");
        if (showLounge) {
          html += renderLoungeFloor(soloBots);
        }
      }

      document.getElementById("building").innerHTML =
        html || `<div style="text-align:center;color:var(--muted);padding:32px">${esc(tr.emptyBuilding)}</div>`;

      // B1 Standalone Workspaces Bar
      const standalone = snapshot.standalone || [];
      const guestBar = document.getElementById("guestBar");
      if (!standalone.length) {
        guestBar.style.display = "none";
      } else {
        guestBar.style.display = "block";
        const activeG = standalone.filter((w) => w.state === "working" || w.needsAttention).length;
        const listHtml = guestExpanded
          ? `<div class="guest-list">${standalone.map((w) => `
              <span class="guest-chip ${w.needsAttention ? "attn" : ""}" data-card-standalone="${esc(w.worktreeId)}" data-dblopen="${esc(w.worktreeId)}" title="${esc(w.activity || tr.stateIdle)}">
                ${w.needsAttention ? "🔴" : (w.state === "working" ? "🟢" : "🪑")} ${esc(w.displayName)}
              </span>`).join("")}</div>`
          : "";
        guestBar.innerHTML = `
          <div class="guest-head" id="guestToggle">
            <span>${esc(tr.guestBar(activeG, standalone.length))}</span>
            <span>${esc(guestExpanded ? tr.collapse : tr.expand)}</span>
          </div>${listHtml}`;
        document.getElementById("guestToggle")?.addEventListener("click", () => {
          guestExpanded = !guestExpanded;
          render();
        });
      }

      // Bind Click (Pop Inspector Card) & Double-Click (Direct Jump)
      document.querySelectorAll("[data-card-bot]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          openCard = { kind: "bot", id: el.getAttribute("data-card-bot") };
          renderModal();
        });
        el.addEventListener("dblclick", (e) => {
          e.stopPropagation();
          const wid = el.getAttribute("data-dblopen");
          if (wid) void openWorkspace(wid, true);
        });
      });
      document.querySelectorAll("[data-card-worker]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          openCard = { kind: "worker", worktreeId: el.getAttribute("data-card-worker") };
          renderModal();
        });
        el.addEventListener("dblclick", (e) => {
          e.stopPropagation();
          const wid = el.getAttribute("data-dblopen");
          if (wid) void openWorkspace(wid, true);
        });
      });
      document.querySelectorAll("[data-card-standalone]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          openCard = { kind: "standalone", worktreeId: el.getAttribute("data-card-standalone") };
          renderModal();
        });
        el.addEventListener("dblclick", (e) => {
          e.stopPropagation();
          const wid = el.getAttribute("data-dblopen");
          if (wid) void openWorkspace(wid, true);
        });
      });

      if (openCard) renderModal();
    }

    async function loadAll(force = false) {
      if (!orcaApi?.plugin?.request) return;
      try {
        const [snap, avs] = await Promise.all([
          orcaApi.plugin.request("office.getSnapshot", { force }),
          Object.keys(avatars).length ? Promise.resolve(avatars) : orcaApi.plugin.request("office.getAvatars", {}),
        ]);
        if (avs) avatars = avs;
        if (snap) snapshot = snap;
        render();
      } catch (err) {
        document.getElementById("building").innerHTML =
          `<div style="color:#f87171;padding:18px">${esc(t().loadErr)}${esc(err?.message || err)}</div>`;
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", () => void loadAll(true));
    document.getElementById("activeOnlyBtn").addEventListener("click", (e) => {
      activeOnly = !activeOnly;
      e.currentTarget.classList.toggle("active", activeOnly);
      render();
    });
    document.getElementById("attnQuickBtn").addEventListener("click", () => {
      const list = snapshot?.attentionList || [];
      if (!list.length) return;
      const item = list[attnCursor % list.length];
      attnCursor += 1;
      openCard = item.kind === "bot"
        ? { kind: "bot", id: item.id }
        : { kind: "worker", worktreeId: item.worktreeId };
      renderModal();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && openCard) {
        openCard = null;
        renderModal();
      }
    });

    if (orcaApi?.plugin?.on) {
      orcaApi.plugin.on("office.snapshot", (snap) => {
        if (snap) { snapshot = snap; render(); }
      });
    }
    if (orcaApi?.on) {
      orcaApi.on("theme", () => render());
    }

    // Hook for automated preview / stress tests when loaded locally outside Orca
    window.__botOfficeInjectMock = (mockSnap, mockAvatars = {}) => {
      snapshot = mockSnap;
      avatars = mockAvatars;
      render();
    };
    window.__botOfficeOpenCard = (cardSpec) => {
      openCard = cardSpec;
      renderModal();
    };

    document.getElementById("loadingText").textContent = t().loading;
    void loadAll(false);
    setInterval(() => { if (snapshot) render(); }, 15000);
  </script>
</body>
</html>
